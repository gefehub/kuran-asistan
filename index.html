/* Layout: one narrow reading column — a shelf of fiches, then the selected fiche rendered below */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 48px;display:grid;gap:24px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--green);padding-bottom:10px}
h1{margin:0;font-size:1.9rem;color:var(--green);font-weight:700;letter-spacing:.2px}
.bism{font-family:var(--f-ar);font-size:1.35rem;color:var(--green);direction:rtl}
.label{font-size:.78rem;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.list{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:inherit;font:inherit;cursor:pointer}

.ghead::-webkit-details-marker{display:none}

.group[open] > .ghead{margin-bottom:8px}
.chev{margin-left:auto;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;margin-right:6px}

.ghead:hover .chev{border-color:var(--green)}

  { id:"bakara-025", ref:"2:25", sure:"Bakara", ayet:25, page:5, titre:"Cennet müjdesi", debut:"وَبَشِّرِ الَّذِينَ", file:"fiches/bakara-025.pdf" },

  { id:"bakara-028", ref:"2:28", sure:"Bakara", ayet:28, page:5, titre:"Ölüm ve diriliş", debut:"كَيْفَ تَكْفُرُونَ", file:"fiches/bakara-028.pdf" },
  { id:"bakara-029", ref:"2:29", sure:"Bakara", ayet:29, page:5, titre:"Yedi gök", debut:"هُوَ الَّذ۪ي", file:"fiches/bakara-029.pdf" },

  { id:"bakara-031", ref:"2:31", sure:"Bakara", ayet:31, page:6, titre:"İsimlerin öğretilmesi", debut:"وَعَلَّمَ اٰدَمَ", file:"fiches/bakara-031.pdf" },

  { id:"bakara-048", ref:"2:48", sure:"Bakara", ayet:48, page:7, titre:"Hesap günü", debut:"وَاتَّقُوا يَوْماً", file:"fiches/bakara-048.pdf" },
];

const list = document.getElementById('list');
const pages = document.getElementById('pages');
let current = null, renderToken = 0;

function buildList(){
  list.innerHTML = '';
  const byPage = new Map();
  FICHES.forEach(f=>{ if(!byPage.has(f.page)) byPage.set(f.page, []); byPage.get(f.page).push(f); });
  [...byPage.keys()].sort((a,b)=>a-b).forEach(p=>{
    const fs = byPage.get(p).sort((a,b)=>a.ayet-b.ayet);
    const g = document.createElement('details'); g.className='group'; g.id='p-'+p;
    const h = document.createElement('summary'); h.className='ghead';
    const first = fs[0], last = fs[fs.length-1];
    h.innerHTML = `<span class="pnum">Sayfa ${p}</span><span class="prange">${first.sure} ${first.ayet}${fs.length>1?'–'+last.ayet:''} · ${fs.length} kart</span><span class="chev" aria-hidden="true"></span>`;
    const ul = document.createElement('ul'); ul.className='list';
    g.appendChild(h); g.appendChild(ul); list.appendChild(g);
    fs.forEach(f=>addItem(ul,f));
  });
}
function addItem(ul,f){
  {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.className = 'item'; b.type = 'button'; b.id = 'f-'+f.id;
    b.innerHTML = `<span class="ref">${f.ref}</span><span class="meta"><b>${f.sure} ${f.ayet}</b><span>${f.titre}</span></span><span class="ar">${f.debut}</span>`;
    b.addEventListener('click',()=>show(f));
    li.appendChild(b); ul.appendChild(li);
  }
}

async function show(f){
  current = f;
  const grp = document.getElementById('p-'+f.page); if(grp) grp.open = true;
  document.querySelectorAll('.item').forEach(el=>el.setAttribute('aria-current', el.id==='f-'+f.id ? 'true':'false'));
  document.getElementById('vtitle').textContent = `${f.sure} ${f.ayet} · ${f.titre} · Sayfa ${f.page}`;
  const token = ++renderToken;
  pages.innerHTML = '<p class="status">Kart yükleniyor…</p>';
  try{
    const buf = await (await fetch(f.file)).arrayBuffer();
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    if(token!==renderToken) return;
    pages.innerHTML = '';
    for(let n=1;n<=pdf.numPages;n++){
      const page = await pdf.getPage(n);
      const base = page.getViewport({scale:1});
      const scale = Math.min(4, (Math.max(pages.clientWidth,320) / base.width) * (window.devicePixelRatio||1) * 1.5);
      const vp = page.getViewport({scale});
      const c = document.createElement('canvas');
      c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      c.setAttribute('aria-label', `${f.sure} ${f.ayet}, sayfa ${n}`);
      pages.appendChild(c);
      await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
      if(token!==renderToken) return;
    }
  }catch(e){
    pages.innerHTML = '<p class="status">Kart burada gösterilemedi. İnternet bağlantını kontrol et.</p>';
  }
}

buildList();

const fs=document.getElementById('fs'), fsinner=document.getElementById('fsinner'), fsbody=document.getElementById('fsbody'), zval=document.getElementById('zval');
let zoom=1;
function setZoom(z){
  zoom=Math.max(1,Math.min(4,Math.round(z*4)/4));
  const fit=Math.min(fsbody.clientWidth-24, 900);
  fsinner.style.width=(fit*zoom)+'px';
  zval.textContent=Math.round(zoom*100)+' %';
}
function openFs(){
  const cs=[...pages.querySelectorAll('canvas')]; if(!cs.length) return;
  fsinner.innerHTML='';
  cs.forEach(c=>{const im=new Image(); im.src=c.toDataURL('image/png'); im.alt=c.getAttribute('aria-label')||''; im.addEventListener('dblclick',()=>setZoom(zoom>1?1:2)); fsinner.appendChild(im);});
  document.getElementById('fstitle').textContent=document.getElementById('vtitle').textContent;
  fs.hidden=false; document.body.style.overflow='hidden';
  setZoom(1); fsbody.scrollTop=0;
  try{ const p=fs.requestFullscreen?.(); if(p&&p.catch) p.catch(()=>{}); }catch(e){}
  document.getElementById('fsclose').focus();
}
function closeFs(){
  fs.hidden=true; document.body.style.overflow='';
  try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){}
}
document.getElementById('vfull').addEventListener('click',openFs);
pages.addEventListener('click',e=>{ if(e.target.tagName==='CANVAS') openFs(); });
document.getElementById('fsclose').addEventListener('click',closeFs);
document.getElementById('zin').addEventListener('click',()=>setZoom(zoom+0.5));
document.getElementById('zout').addEventListener('click',()=>setZoom(zoom-0.5));
document.getElementById('zfit').addEventListener('click',()=>setZoom(1));
document.addEventListener('keydown',e=>{ if(fs.hidden) return; if(e.key==='Escape') closeFs(); if(e.key==='+'||e.key==='=') setZoom(zoom+0.5); if(e.key==='-') setZoom(zoom-0.5); });
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && !fs.hidden) setZoom(zoom); });
window.addEventListener('resize',()=>{ if(!fs.hidden) setZoom(zoom); });
const btn = document.getElementById('vopen'), note = document.getElementById('vnote');
btn.hidden = false;
btn.addEventListener('click', async ()=>{
  if(!current) return;
  btn.disabled = true; note.hidden = true;
  const name = `${current.sure}-${current.ayet}-kart.pdf`;
  try{
    const blob = await (await fetch(current.file)).blob();
    const file = new File([blob], name, {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:name});
    }else{
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    }
  }catch(e){
    if(!(e && e.name==='AbortError')){ note.textContent='PDF şu an kaydedilemedi.'; note.hidden=false; }
  }finally{ btn.disabled = false; }
});
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
const fromHash = FICHES.find(f=>'#'+f.id===location.hash);
const lastFiche = [...FICHES].sort((a,b)=>a.page-b.page||a.ayet-b.ayet).pop();
show(fromHash || lastFiche);
</script>
